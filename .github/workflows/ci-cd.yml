name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Verify & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build Production Application
        run: npm run build

  deploy:
    name: Deploy to Vercel (thejeevan.in)
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID || 'team_3K4q0EQIVt1mkTlV6FTcSifl' }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID || 'prj_Ze9YgzQLBj7Z6udyMfTbfz66Nrka' }}
          vercel-args: '--prod'
          scope: ${{ secrets.VERCEL_ORG_ID || 'team_3K4q0EQIVt1mkTlV6FTcSifl' }}
