<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14362B"/>
      <stop offset="100%" stop-color="#0B1C15"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF6E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D4AF6E" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#glow)"/>

  <!-- Outer Antique Gold Hairline -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#D4AF6E" stroke-opacity="0.65" stroke-width="4"/>
  <!-- Inner Subtle Accent Border -->
  <rect x="36" y="36" width="440" height="440" rx="76" fill="none" stroke="#B08D57" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Monogram Serif 'J' -->
  <text x="256" y="362" text-anchor="middle" font-family="Georgia, 'Cormorant Garamond', serif" font-size="330" font-weight="bold" fill="#F4E4C1" filter="url(#shadow)">J</text>

  <!-- Status Emerald Accent Dot -->
  <circle cx="366" cy="94" r="15" fill="#3EC481" stroke="#D4AF6E" stroke-width="3"/>
</svg>
